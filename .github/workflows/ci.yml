name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Called from release.yml: a release waits for these checks.
  workflow_call:

permissions:
  contents: read

# A new push to the same branch cancels a run that is still going: the old result is no
# longer needed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check author addresses across the whole history
          persist-credentials: false

      # The public history has only noreply addresses. Checked on a push to any branch (other
      # people's pull requests come with their own addresses, this does not concern them).
      - name: Адреса авторов
        if: github.event_name == 'push'
        run: |
          bad=$(git log --format='%h %ae %ce' | ALLOWED='(@users\.noreply\.github\.com|^noreply@github\.com)$' awk '$2 !~ ENVIRON["ALLOWED"] || $3 !~ ENVIRON["ALLOWED"]')
          if [ -n "$bad" ]; then echo "Коммиты с личным адресом:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config patch libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev libpipewire-0.3-dev xvfb xclip x11-utils libgl1-mesa-dri

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

      - name: Патч Gio и go vet
        run: |
          make gio
          go vet ./...

      # The tests draw through headless Gio (EGL). Without a GPU this goes through software Mesa
      # (surfaceless EGL), xvfb is needed by the X11 tests; tests that have nothing to draw with
      # skip themselves.
      - name: Тесты
        run: xvfb-run -a make test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Headless rendering runs without a window: surfaceless does not depend on whether Xvfb
          # supports DRI.
          EGL_PLATFORM: surfaceless

      - name: Сборка
        run: |
          make build
          ./bin/scrawl -version

  # Windows is built and tested on real Windows: the tests are not tied to Linux
  # (user folders are replaced via internal/testenv), and the build uses the same script
  # as the release. Details in docs/WINDOWS.md.
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0" # runner has gcc, but the Windows build needs no cgo (and Linux packages' C files get in the way)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Сборка (как в релизе)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "ci-${env:GITHUB_SHA}" -Package

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      - name: Запуск собранной программы
        shell: pwsh
        run: ./bin/scrawl.exe -version
