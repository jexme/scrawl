name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # для проверки адресов авторов по всей истории

      # В публичной истории только noreply-адреса. Проверяем при пуше в любую ветку (чужие
      # pull request приходят со своими адресами, их это не касается).
      - name: Адреса авторов
        if: github.event_name == 'push'
        run: |
          bad=$(git log --format='%h %ae %ce' | ALLOWED='(@users\.noreply\.github\.com|^noreply@github\.com)$' awk '$2 !~ ENVIRON["ALLOWED"] || $3 !~ ENVIRON["ALLOWED"]')
          if [ -n "$bad" ]; then echo "Коммиты с личным адресом:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config patch libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev libpipewire-0.3-dev xvfb xclip x11-utils libgl1-mesa-dri

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

      - name: Патч Gio и go vet
        run: |
          make gio
          go vet ./...

      # Тесты рисуют через headless Gio (EGL). Без GPU это идёт через программный Mesa
      # (surfaceless EGL), xvfb нужен тестам X11; тесты, которым рисовать нечем, сами себя пропускают.
      - name: Тесты
        run: xvfb-run -a make test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Headless-рендер идёт без окна: surfaceless не зависит от того, умеет ли Xvfb DRI.
          EGL_PLATFORM: surfaceless

      - name: Сборка
        run: |
          make build
          ./bin/scrawl -version

  # Windows пока не работает целиком (нет захвата, буфера обмена и горячей клавиши),
  # но код должен продолжать собираться: так видно, что новые правки не привязали
  # к Linux лишнего. Подробности в docs/WINDOWS.md.
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Патч Gio
        run: make gio

      - name: Сборка и go vet для Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build -o scrawl.exe ./cmd/scrawl
