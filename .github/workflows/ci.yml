name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # для проверки адресов авторов по всей истории

      # В публичной истории только noreply-адреса. Проверяем при пуше в любую ветку (чужие
      # pull request приходят со своими адресами, их это не касается).
      - name: Адреса авторов
        if: github.event_name == 'push'
        run: |
          bad=$(git log --format='%h %ae %ce' | ALLOWED='(@users\.noreply\.github\.com|^noreply@github\.com)$' awk '$2 !~ ENVIRON["ALLOWED"] || $3 !~ ENVIRON["ALLOWED"]')
          if [ -n "$bad" ]; then echo "Коммиты с личным адресом:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config patch libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev libpipewire-0.3-dev xvfb xclip x11-utils libgl1-mesa-dri

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

      - name: Патч Gio и go vet
        run: |
          make gio
          go vet ./...

      # Тесты рисуют через headless Gio (EGL). Без GPU это идёт через программный Mesa
      # (surfaceless EGL), xvfb нужен тестам X11; тесты, которым рисовать нечем, сами себя пропускают.
      - name: Тесты
        run: xvfb-run -a make test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Headless-рендер идёт без окна: surfaceless не зависит от того, умеет ли Xvfb DRI.
          EGL_PLATFORM: surfaceless

      - name: Сборка
        run: |
          make build
          ./bin/scrawl -version

  # Windows собираем и тестируем на настоящем Windows: тесты не привязаны к Linux
  # (папки пользователя подменяются через internal/testenv), а сборка идёт тем же скриптом,
  # что и релиз. Подробности в docs/WINDOWS.md.
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0" # на раннере есть gcc, но Windows-сборке cgo не нужен (и C-файлы Linux-пакетов ему мешают)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Сборка (как в релизе)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "ci-${env:GITHUB_SHA}" -Package

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      - name: Запуск собранной программы
        shell: pwsh
        run: ./bin/scrawl.exe -version
