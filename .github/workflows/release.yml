name: Release

# A release is made for a tag like v1.2.3 (or v1.2.3-rc1: it is marked as a pre-release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A release may only be cut from a commit that is already on main: a tag pushed on a side
  # branch (or by mistake) must not publish anything.
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not in main. Merge it first, then tag main."
            exit 1
          fi

  # The CI tests (gofmt, go vet, the whole test suite, the Linux and Windows builds) must pass for
  # the tagged commit before anything is published. They are run again here, as a reusable
  # workflow, instead of looking up an earlier run: a tag pushed right after the commit would
  # otherwise race with a still-running CI. The price is a few minutes per release.
  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config patch libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev libpipewire-0.3-dev

      - name: Archive and checksums
        run: |
          make dist VERSION="${GITHUB_REF_NAME}"
          make deb VERSION="${GITHUB_REF_NAME}"
          cd dist
          # The Debian version has "~" (0.1.0~rc3), but GitHub stores a release asset with
          # "." in its place. Rename before hashing so that SHA256SUMS lists the names users
          # actually download and `sha256sum -c` matches.
          for f in scrawl_*~*.deb; do
            [ -e "$f" ] && mv "$f" "$(printf '%s' "$f" | tr '~' '.')"
          done
          sha256sum scrawl-*.tar.gz scrawl_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/scrawl-*.tar.gz dist/scrawl_*.deb dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Scrawl ${GITHUB_REF_NAME}" $flags

  # arm64: the same archive and .deb built natively on a GitHub arm64 runner and added to the
  # release. It is best effort: if the runner or the build fails, the release stays as it is
  # (amd64 and Windows) and the apt repository is still updated.
  linux-arm64:
    needs: release
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config patch libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev libpipewire-0.3-dev

      - name: Archive, .deb and checksums
        run: |
          make dist VERSION="${GITHUB_REF_NAME}"
          make deb VERSION="${GITHUB_REF_NAME}"
          cd dist
          for f in scrawl_*~*.deb; do
            [ -e "$f" ] && mv "$f" "$(printf '%s' "$f" | tr '~' '.')"
          done
          sha256sum scrawl-*-linux-arm64.tar.gz scrawl_*_arm64.deb > SHA256SUMS-arm64
          cat SHA256SUMS-arm64

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/scrawl-*-linux-arm64.tar.gz dist/scrawl_*_arm64.deb dist/SHA256SUMS-arm64

  # Windows: a portable archive, the bare scrawl.exe, their SHA-256 and the Scoop manifest. It is built on real
  # Windows in public CI, and the origin of the file is confirmed by a GitHub attestation
  # (gh attestation verify).
  windows:
    needs: release
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and archive
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${env:GITHUB_REF_NAME}" -Package

      # The Inno Setup installer. It has not been tried on a real runner yet, so a failure here
      # (no iscc, a script error) must never block the release: continue-on-error. If it fails,
      # the release simply has no setup exe, and the later steps skip it.
      - name: Installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart('v')
          # The file version resource needs four numbers: 0.1.0-rc3 -> 0.1.0.0
          $num = "0.0.0.0"
          if ($ver -match '^(\d+)\.(\d+)\.(\d+)') { $num = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$ver" "/DNumVersion=$num" packaging\windows\scrawl.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc exited with code $LASTEXITCODE" }
          $setup = Get-Item "dist/scrawl-v$ver-windows-amd64-setup.exe"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256" -Encoding ascii
          Write-Host "Installer: $($setup.Name) $hash"

      - name: Build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/scrawl-*-windows-amd64.zip
            dist/scrawl-*-windows-amd64.exe
            dist/scrawl-*-windows-amd64-setup.exe

      - name: Scoop manifest
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $hash = ((Get-Content dist/scrawl-*-windows-amd64.zip.sha256) -split '\s+')[0]
          (Get-Content packaging/windows/scoop/scrawl.json.in -Raw).Replace('@VERSION@', $ver).Replace('@HASH@', $hash) |
            Set-Content dist/scrawl.json -Encoding utf8

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PowerShell does not expand * for external programs, so we build the file list ourselves.
          $files = Get-ChildItem dist/scrawl-*-windows-amd64.zip, dist/scrawl-*-windows-amd64.zip.sha256, dist/scrawl-*-windows-amd64.exe, dist/scrawl-*-windows-amd64.exe.sha256, dist/scrawl.json | ForEach-Object FullName
          # The installer and its hash exist only if the optional installer step worked.
          $files += Get-ChildItem dist/scrawl-*-windows-amd64-setup.exe, dist/scrawl-*-windows-amd64-setup.exe.sha256 -ErrorAction SilentlyContinue | ForEach-Object FullName
          gh release upload "${env:GITHUB_REF_NAME}" @files --clobber

  # After the release we update the apt repository (if a signing key is configured).
  apt-repo:
    needs: [release, linux-arm64]
    # The arm64 build is optional: its failure must not stop the repository from updating.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt-repo.yml
    secrets:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
