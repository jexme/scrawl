# Once a week proposes updating the versions of actions in .github/workflows. Go modules
# are left alone: gioui.org is replaced with a patched copy (third_party/gio), and its
# version is changed by hand together with gio.patch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: [ci]
